name: Wails build

on: [push, pull_request]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        build:
          - "TcpPlayback|linux/amd64|ubuntu-latest"
          - "TcpPlayback|windows/amd64|windows-latest"
    runs-on: ${{ fromJSON('["' + join(split(matrix.build, '|'), '","') + '"]')[2] }}
    steps:
      - uses: actions/checkout@v2
        with:
          submodules: recursive
      - uses: dAppServer/wails-build-action@v3
        with:
          build-name: ${{ matrix.build.name }}
          build-platform: ${{ matrix.build.platform }}
          build-obfuscate: true
      - name: Archive build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.extract.outputs.name }}-${{ steps.extract.outputs.platform }}
          path: |
            ./build/bin/**  
