name: Wails build

on: [push, pull_request]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        name: [TcpPlayback]
        platform: [linux/amd64, windows/amd64]
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.build.os }}
    steps:
      - uses: actions/checkout@v2
        with:
          submodules: recursive
      - uses: dAppServer/wails-build-action@v3
        with:
          build-name: ${{ matrix.build.name }}
          build-platform: ${{ matrix.build.platform }}
          build-obfuscate: true
      - name: Archive build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.extract.outputs.name }}-${{ steps.extract.outputs.platform }}
          path: |
            ./build/bin/**  
release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: dist/**/*

      # Optionally, output the release URL
      - run: echo "Release published: ${{ steps.create_release.outputs.url }}"
